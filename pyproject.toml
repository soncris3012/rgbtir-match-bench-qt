[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbtir-match-bench"
version = "0.1.0"
description = "Qt benchmark for RGB-thermal local feature matching on LLVIP and RoadScene"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "soncris3012"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2",
  "torchvision>=0.17",
  "kornia>=0.7.3",
  "lightglue @ git+https://github.com/cvg/LightGlue.git",
]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
rgbtir-bench = "rgbtir_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

